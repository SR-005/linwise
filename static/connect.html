<!DOCTYPE html>
<html lang="en" class="h-full bg-[#08090d] text-slate-100 selection:bg-purple-600/30 selection:text-purple-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linwise — Connect Linways</title>

  <!-- Agrandir Typography CDN -->
  <link href="https://fonts.cdnfonts.com/css/agrandir" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Agrandir', 'sans-serif'],
            mono: ['Agrandir Wide', 'Agrandir', 'sans-serif'],
            grand: ['Agrandir Grand Heavy', 'Agrandir Grand', 'sans-serif'],
            wide: ['Agrandir Wide', 'Agrandir', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    *, html, body, button, input {
      font-family: 'Agrandir', sans-serif !important;
    }

    .font-grand {
      font-family: 'Agrandir Grand Heavy', 'Agrandir Grand', sans-serif !important;
      letter-spacing: -0.02em;
    }

    .font-wide {
      font-family: 'Agrandir Wide', 'Agrandir', sans-serif !important;
      letter-spacing: 0.02em;
    }

    /* Outer Glass Card */
    .glass-surface {
      background: rgba(22, 24, 30, 0.72);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
        0 30px 80px -20px rgba(0, 0, 0, 0.9);
    }

    /* Input Glass */
    .glass-input {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="h-full flex items-center justify-center overflow-y-auto antialiased bg-[#08090d] text-slate-100 relative p-4 sm:p-6 lg:p-8">

  <!-- Ambient Light Fields -->
  <div class="fixed top-[-10%] left-[-5%] w-[650px] h-[650px] bg-indigo-600/10 rounded-full blur-[160px] pointer-events-none z-0"></div>
  <div class="fixed bottom-[-15%] right-[-5%] w-[700px] h-[700px] bg-purple-600/10 rounded-full blur-[170px] pointer-events-none z-0"></div>

  <!-- Notification Toast -->
  <div id="toast" class="hidden fixed top-6 z-50 px-5 py-3 rounded-2xl glass-surface text-xs font-wide font-medium shadow-2xl transition border"></div>

  <!-- 670px Height Fixed Card with Full-Bleed Black Right Section -->
  <div class="w-full max-w-[1140px] h-[670px] glass-surface rounded-[36px] overflow-hidden z-10 grid grid-cols-1 md:grid-cols-2">
    
    <!-- Left: Connect Form Area -->
    <div class="w-full h-full flex flex-col justify-center px-8 sm:px-14 lg:px-16 py-12 order-2 md:order-1">
      <div class="max-w-[400px] w-full mx-auto space-y-6">
        <div>
          <h1 class="text-3xl sm:text-4xl lg:text-[38px] font-wide font-bold text-white tracking-tight leading-tight">
            Connect Your<br>Linways Account
          </h1>
          <p class="text-xs font-wide text-zinc-400 mt-2 leading-relaxed">
            We use these credentials securely to scrape and sync your attendance directly from your college portal.
          </p>
        </div>

        <form id="connect-form" onsubmit="handleConnectSubmit(event)" class="space-y-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-wide text-zinc-300">Username</label>
            <input 
              type="text" 
              id="linways-username" 
              required
              class="w-full px-5 py-3.5 rounded-2xl glass-input text-sm text-white placeholder-zinc-600 focus:outline-none transition font-wide"
              placeholder="e.g. P012CSOM23"
            />
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-wide text-zinc-300">Password</label>
            <input 
              type="password" 
              id="linways-password" 
              required
              class="w-full px-5 py-3.5 rounded-2xl glass-input text-sm text-white placeholder-zinc-600 focus:outline-none transition font-wide"
              placeholder="Your Linways portal password"
            />
          </div>

          <button 
            type="submit" 
            id="connect-btn"
            class="w-full py-4 mt-2 rounded-full bg-white hover:bg-zinc-200 text-black font-wide font-bold text-sm tracking-wide transition shadow-xl hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2"
          >
            <span id="connect-btn-text">Connect</span>
            <i class="ph ph-arrows-clockwise hidden animate-spin text-base" id="connect-spinner"></i>
          </button>
        </form>

        <p class="text-center text-xs font-wide text-zinc-400">
          if you forgot your linways password, please reset it 
          <a href="https://aisat.linways.com/student/forgot.php" target="_blank" rel="noopener noreferrer" class="text-white hover:text-zinc-200 font-semibold underline underline-offset-4 transition font-wide">
            here
          </a>
        </p>
      </div>
    </div>

    <!-- Right: Picture Side Filled Edge-to-Edge -->
    <div class="w-full h-full bg-black flex items-center justify-center p-10 select-none order-1 md:order-2">
      <img 
        src="/static/linwise.png" 
        alt="Linwise Logo" 
        class="w-[280px] sm:w-[320px] lg:w-[360px] h-[280px] sm:h-[320px] lg:h-[360px] object-contain mix-blend-screen"
      />
    </div>

  </div>

  <script>
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `fixed top-6 z-50 px-5 py-3 rounded-2xl glass-surface text-xs font-wide font-medium shadow-2xl transition border ${
        isError ? 'border-rose-500/40 text-rose-300' : 'border-emerald-500/40 text-emerald-300'
      }`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    async function handleConnectSubmit(e) {
      e.preventDefault();
      const studentId = document.getElementById('linways-username').value.trim();
      const password = document.getElementById('linways-password').value.trim();
      const btnText = document.getElementById('connect-btn-text');
      const spinner = document.getElementById('connect-spinner');

      if (!studentId || !password) return;

      btnText.textContent = "Verifying with Linways...";
      spinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
          showToast("Connected to Linways successfully! Loading workspace...");
          setTimeout(() => {
            window.location.href = "/";
          }, 900);
        } else {
          showToast(data.detail || "Linways authentication failed. Check credentials.", true);
          btnText.textContent = "Connect";
          spinner.classList.add('hidden');
        }
      } catch (err) {
        showToast("Error connecting to server. Taking you to dashboard...", true);
        setTimeout(() => {
          window.location.href = "/";
        }, 1200);
      }
    }
  </script>
</body>
</html>
